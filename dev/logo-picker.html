<!doctype html>
<!-- DEV ONLY. Not linked from any page and not in sitemap.xml. Delete before launch (see README).
     Logo exploration built with the prototype skill. Flip with 1/2/3 or the arrow keys.
     To switch the live logo, change ONE line in js/site-config.js: images.logoMark. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Logo picker (dev) | Learn To Give</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .stage-wrap { padding-bottom: 6rem; }
    .demo-header { background: var(--cream); border-bottom: 1px solid var(--border); }
    .demo-header .header-inner { min-height: 4.25rem; }
    .demo-nav { display: none; gap: 1.25rem; font-weight: 700; color: var(--maroon); }
    @media (min-width: 48em) { .demo-nav { display: flex; } }
    .demo-grid { display: grid; gap: 1.5rem; margin-top: 2rem; }
    @media (min-width: 48em) { .demo-grid { grid-template-columns: 1.2fr 1fr; } }
    .sizes { display: flex; align-items: flex-end; gap: 1.5rem; flex-wrap: wrap; }
    .sizes figure { margin: 0; text-align: center; font-size: 0.875rem; color: var(--muted); }
    .sizes img { margin: 0 auto 0.4rem; }
    .tab-mock { display: inline-flex; align-items: center; gap: 0.5rem; background: #E9E2D8; border-radius: 10px 10px 0 0; padding: 0.5rem 0.9rem; font: 600 0.875rem/1 system-ui, sans-serif; color: #333; }
    .tab-mock.dark { background: #2B2B2B; color: #eee; }
    .app-tile { width: 90px; height: 90px; border-radius: 20px; background: var(--cream); box-shadow: var(--shadow); display: grid; place-items: center; }
    .demo-footer { background: var(--maroon); color: var(--cream); border-radius: var(--radius); padding: 1.5rem; display: flex; align-items: center; gap: 0.75rem; }
    .demo-footer .footer-name { margin: 0; }
    .mark-badge { background: var(--cream); border-radius: 12px; padding: 4px; }
    .axis { color: var(--muted); }
  </style>
  <style>
    /* Picker chrome: verbatim from .claude/ui-refs/prototype/PICKER.md */
    .proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
    .proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
    .proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
    @media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
    .proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
    .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
    .proto-picker-item:active { transform: scale(0.97); }
    .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
    .proto-picker-item[data-active] { color: #fff; }
    .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
    .proto-picker-replay { padding: 0 10px; font-size: 14px; }
    .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
  </style>
</head>
<body>
  <div class="stage-wrap" id="stage"></div>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Book heart</button>
    <button class="proto-picker-item">Pencil heart</button>
    <button class="proto-picker-item">Sunrise</button>
  </nav>

  <script>
    var VARIANTS = [
      { name: 'A. Book heart', file: '../images/logo-mark.svg', config: "images/logo-mark.svg",
        axis: 'Shape: one closed silhouette. The open book and the heart are the same object.',
        alt: 'Learn To Give logo: an open book whose pages curve up into a heart' },
      { name: 'B. Pencil heart', file: '../images/logo-mark-pencil.svg', config: "images/logo-mark-pencil.svg",
        axis: 'Gesture: a diagonal tool in motion. Reads as "doing the work", more playful.',
        alt: 'Learn To Give logo: a pencil whose eraser end is a heart' },
      { name: 'C. Sunrise', file: '../images/logo-mark-sunrise.svg', config: "images/logo-mark-sunrise.svg",
        axis: 'Emblem: a wide scene with rays. Hopeful and Indian-summer warm, the most detailed.',
        alt: 'Learn To Give logo: a saffron sun rising over an open book' }
    ];

    function render(v) {
      return '' +
        '<header class="demo-header"><div class="container header-inner">' +
          '<a class="wordmark" href="#"><img class="wordmark-mark" src="' + v.file + '" alt="" width="40" height="40"><span>Learn To Give</span></a>' +
          '<nav class="demo-nav"><span>About</span><span>Classes</span><span>Donate</span></nav>' +
        '</div></header>' +
        '<main class="container">' +
          '<h1 style="margin-top:2rem">' + v.name + '</h1>' +
          '<p class="axis">' + v.axis + '</p>' +
          '<p>Config line: <code>logoMark: \'' + v.config + '\'</code></p>' +
          '<div class="demo-grid">' +
            '<div class="card"><h2 class="h3">Sizes</h2><div class="sizes">' +
              [160, 64, 32, 16].map(function (s) {
                return '<figure><img src="' + v.file + '" alt="' + (s === 160 ? v.alt : '') + '" width="' + s + '" height="' + s + '"><figcaption>' + s + 'px</figcaption></figure>';
              }).join('') +
            '</div></div>' +
            '<div class="card"><h2 class="h3">In context</h2>' +
              '<p><span class="tab-mock"><img src="' + v.file + '" alt="" width="16" height="16">Learn To Give</span> ' +
              '<span class="tab-mock dark"><span class="mark-badge" style="padding:1px;border-radius:4px"><img src="' + v.file + '" alt="" width="14" height="14"></span>Learn To Give</span></p>' +
              '<div class="app-tile"><img src="' + v.file + '" alt="" width="64" height="64"></div>' +
            '</div>' +
          '</div>' +
          '<div class="demo-footer" style="margin-top:1.5rem"><span class="mark-badge"><img src="' + v.file + '" alt="" width="36" height="36"></span><p class="footer-name" lang="en">Learn To Give</p></div>' +
        '</main>';
    }
    var variants = VARIANTS.map(function (v) { return function () { return render(v); }; });

    /* Reference wiring: verbatim from PICKER.md */
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
